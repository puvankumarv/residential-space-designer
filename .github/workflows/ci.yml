name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (checker rules, shipped layouts, skill package)
        run: python -m unittest discover -s tests -v
      - name: Check every example and scenario layout
        run: |
          for f in residential-space-designer/examples/*.json residential-space-designer/evals/runs/*.json; do
            echo "== $f"
            python residential-space-designer/scripts/check_layout.py "$f"
          done
      - name: Generated scenario layouts match the committed files
        run: |
          python residential-space-designer/evals/build_runs.py
          python residential-space-designer/evals/build_regional.py
          git diff --exit-code -- residential-space-designer/evals/runs
