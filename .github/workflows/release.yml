name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test before releasing
        run: python -m unittest discover -s tests
      - name: Check the tag matches plugin.json
        run: |
          v=$(python -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "plugin.json version $v does not match tag $GITHUB_REF_NAME"; exit 1; }
      - name: Build the skill ZIP
        run: |
          zip -r residential-space-designer.zip residential-space-designer -x '*/__pycache__/*'
          unzip -l residential-space-designer.zip | tail -1
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" residential-space-designer.zip \
            --title "Residential Space Designer $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md
